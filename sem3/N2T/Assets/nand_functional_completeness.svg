<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="850" height="480" fill="url(#bgGrad2)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="425" y="36" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">NAND Gate Functional Completeness Derivations</text>
  <text x="425" y="60" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Constructing NOT, AND, and OR gates exclusively from 2-input NAND primitives</text>

  <!-- Section 1: NOT from NAND -->
  <g transform="translate(40, 85)">
    <rect width="770" height="100" rx="10" fill="rgba(239, 68, 68, 0.05)" stroke="rgba(239, 68, 68, 0.2)"/>
    <text x="20" y="30" fill="#ef4444" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">1. NOT(x) = NAND(x, x)</text>
    <text x="20" y="55" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="12">x ──┬──[Pin a] NAND ── Not(x) = x̄</text>
    <text x="20" y="75" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="12">    └──[Pin b]</text>

    <!-- Visual schematic -->
    <circle cx="280" cy="50" r="5" fill="#f59e0b"/>
    <text x="265" y="55" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="14" font-weight="bold">x</text>
    <line x1="285" y1="50" x2="330" y2="50" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="330" y1="35" x2="330" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="330" y1="35" x2="360" y2="35" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="330" y1="65" x2="360" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- NAND Gate -->
    <rect x="360" y="20" width="60" height="60" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="426" cy="50" r="4" fill="#090d16" stroke="#ef4444" stroke-width="2"/>
    <text x="390" y="55" fill="#fff" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">NAND</text>
    <line x1="431" y1="50" x2="480" y2="50" stroke="#10b981" stroke-width="3"/>
    <circle cx="480" cy="50" r="5" fill="#10b981"/>
    <text x="495" y="55" fill="#10b981" font-family="'Fira Code', monospace" font-size="14" font-weight="bold">out = !x</text>

    <text x="610" y="55" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12">Truth: 0 → 1, 1 → 0</text>
  </g>

  <!-- Section 2: AND from NAND -->
  <g transform="translate(40, 205)">
    <rect width="770" height="115" rx="10" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="20" y="28" fill="#10b981" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">2. AND(a, b) = NOT(NAND(a, b)) = NAND( NAND(a,b), NAND(a,b) )</text>
    
    <!-- Schematic -->
    <text x="25" y="55" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="14">a ──</text>
    <text x="25" y="85" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="14">b ──</text>
    <line x1="65" y1="50" x2="110" y2="50" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="65" y1="80" x2="110" y2="80" stroke="#f59e0b" stroke-width="2.5"/>

    <rect x="110" y="35" width="60" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="176" cy="65" r="4" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="70" fill="#fff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">NAND 1</text>

    <line x1="181" y1="65" x2="230" y2="65" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="230" y1="50" x2="230" y2="80" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="230" y1="50" x2="260" y2="50" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="230" y1="80" x2="260" y2="80" stroke="#60a5fa" stroke-width="2.5"/>

    <rect x="260" y="35" width="60" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="326" cy="65" r="4" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <text x="290" y="70" fill="#fff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">NAND 2</text>

    <line x1="331" y1="65" x2="380" y2="65" stroke="#10b981" stroke-width="3"/>
    <circle cx="380" cy="65" r="5" fill="#10b981"/>
    <text x="395" y="70" fill="#10b981" font-family="'Fira Code', monospace" font-size="14" font-weight="bold">out = a · b</text>

    <text x="560" y="65" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Double negation cancels bubble:</text>
    <text x="560" y="85" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="12">NOT(NOT(a · b)) = a · b</text>
  </g>

  <!-- Section 3: OR from NAND -->
  <g transform="translate(40, 340)">
    <rect width="770" height="120" rx="10" fill="rgba(99, 102, 241, 0.05)" stroke="rgba(99, 102, 241, 0.2)"/>
    <text x="20" y="26" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">3. OR(a, b) = NAND(NOT(a), NOT(b)) [De Morgan's Theorem]</text>

    <!-- Invert a -->
    <text x="25" y="55" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">a ──</text>
    <line x1="55" y1="50" x2="80" y2="50" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="40" x2="80" y2="60" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="40" x2="105" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="60" x2="105" y2="60" stroke="#f59e0b" stroke-width="2"/>
    <rect x="105" y="32" width="45" height="36" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="154" cy="50" r="3" fill="#090d16" stroke="#6366f1" stroke-width="1.5"/>
    <text x="127" y="54" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND</text>

    <!-- Invert b -->
    <text x="25" y="95" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">b ──</text>
    <line x1="55" y1="90" x2="80" y2="90" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="80" x2="80" y2="100" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="80" x2="105" y2="80" stroke="#f59e0b" stroke-width="2"/>
    <line x1="80" y1="100" x2="105" y2="100" stroke="#f59e0b" stroke-width="2"/>
    <rect x="105" y="72" width="45" height="36" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="154" cy="90" r="3" fill="#090d16" stroke="#6366f1" stroke-width="1.5"/>
    <text x="127" y="94" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND</text>

    <!-- Connect to final NAND -->
    <line x1="158" y1="50" x2="220" y2="50" stroke="#60a5fa" stroke-width="2"/>
    <line x1="220" y1="50" x2="220" y2="60" stroke="#60a5fa" stroke-width="2"/>
    <line x1="220" y1="60" x2="250" y2="60" stroke="#60a5fa" stroke-width="2"/>

    <line x1="158" y1="90" x2="220" y2="90" stroke="#60a5fa" stroke-width="2"/>
    <line x1="220" y1="90" x2="220" y2="80" stroke="#60a5fa" stroke-width="2"/>
    <line x1="220" y1="80" x2="250" y2="80" stroke="#60a5fa" stroke-width="2"/>

    <rect x="250" y="47" width="60" height="46" rx="5" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="314" cy="70" r="4" fill="#090d16" stroke="#818cf8" stroke-width="2"/>
    <text x="280" y="75" fill="#fff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">NAND 3</text>

    <line x1="319" y1="70" x2="380" y2="70" stroke="#10b981" stroke-width="3"/>
    <circle cx="380" cy="70" r="5" fill="#10b981"/>
    <text x="395" y="75" fill="#10b981" font-family="'Fira Code', monospace" font-size="14" font-weight="bold">out = a + b</text>

    <text x="560" y="65" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">De Morgan's Inversion:</text>
    <text x="560" y="85" fill="#c7d2fe" font-family="'Fira Code', monospace" font-size="12">NOT(NOT(a) · NOT(b)) = a + b</text>
  </g>
</svg>