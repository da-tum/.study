<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#bgGrad10)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="400" y="34" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">1-Bit Memory Register ('Bit' Chip) Implementation</text>
  <text x="400" y="58" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Feedback loop with DFF: if load=1 out(t)=in(t-1); if load=0 out(t)=out(t-1)</text>

  <!-- Input in -->
  <line x1="80" y1="140" x2="220" y2="140" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="80" cy="140" r="5" fill="#f59e0b"/>
  <text x="70" y="145" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" text-anchor="end">in</text>
  <text x="210" y="135" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11">b</text>

  <!-- Feedback line from DFF out to Mux pin a -->
  <line x1="80" y1="180" x2="220" y2="180" stroke="#10b981" stroke-width="2.5"/>
  <text x="210" y="175" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11">a</text>

  <!-- Mux Gate -->
  <rect x="220" y="115" width="110" height="90" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
  <text x="275" y="152" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mux</text>
  <text x="275" y="172" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">sel = load</text>

  <!-- load control signal -->
  <line x1="275" y1="280" x2="275" y2="205" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="275" cy="280" r="5" fill="#f59e0b"/>
  <text x="275" y="305" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">load</text>

  <!-- Output of Mux to DFF -->
  <line x1="330" y1="160" x2="430" y2="160" stroke="#a78bfa" stroke-width="3"/>
  <text x="380" y="150" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">muxOut</text>

  <!-- DFF (D-Flip-Flop) Block -->
  <rect x="430" y="110" width="130" height="100" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="2.5"/>
  <text x="495" y="148" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DFF</text>
  <text x="495" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Clocked Storage</text>
  <polygon points="430,185 442,192 430,199" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="455" y="195" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">clk</text>

  <!-- DFF Output -->
  <line x1="560" y1="160" x2="710" y2="160" stroke="#10b981" stroke-width="4"/>
  <circle cx="710" cy="160" r="6" fill="#10b981"/>
  <text x="725" y="165" fill="#10b981" font-family="'Fira Code', monospace" font-size="18" font-weight="bold">out</text>

  <!-- Feedback Route -->
  <line x1="620" y1="160" x2="620" y2="240" stroke="#10b981" stroke-width="2.5"/>
  <line x1="620" y1="240" x2="80" y2="240" stroke="#10b981" stroke-width="2.5"/>
  <line x1="80" y1="240" x2="80" y2="180" stroke="#10b981" stroke-width="2.5"/>

  <!-- Legend / Operation Note -->
  <g transform="translate(380, 260)">
    <rect width="360" height="75" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="180" y="24" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sequential Operation Rule</text>
    <text x="20" y="46" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="11">load=1 → out(t+1) = in(t)    (Write cycle)</text>
    <text x="20" y="65" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="11">load=0 → out(t+1) = out(t)   (Memory hold)</text>
  </g>
</svg>