<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad9)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="400" y="34" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">4-Way Demultiplexer (DMux4Way) Tree Design</text>
  <text x="400" y="58" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Routes 1 input line 'in' to one of 4 outputs {a, b, c, d} based on 2-bit select {sel[1], sel[0]}</text>

  <!-- Input in -->
  <line x1="60" y1="190" x2="160" y2="190" stroke="#f59e0b" stroke-width="3.5"/>
  <circle cx="60" cy="190" r="5" fill="#f59e0b"/>
  <text x="50" y="195" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" text-anchor="end">in</text>

  <!-- Stage 1 DMux -->
  <rect x="160" y="140" width="130" height="100" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="2"/>
  <text x="225" y="180" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DMux (Stage 1)</text>
  <text x="225" y="205" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">sel = sel[1]</text>

  <!-- sel[1] line -->
  <line x1="225" y1="340" x2="225" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="225" cy="340" r="5" fill="#38bdf8"/>
  <text x="225" y="365" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">sel[1]</text>

  <!-- Outputs from Stage 1 -->
  <!-- Upper line (to DMux AB) -->
  <line x1="290" y1="165" x2="430" y2="165" stroke="#fca5a5" stroke-width="3"/>
  <line x1="430" y1="165" x2="430" y2="125" stroke="#fca5a5" stroke-width="3"/>
  <line x1="430" y1="125" x2="460" y2="125" stroke="#fca5a5" stroke-width="3"/>

  <!-- Lower line (to DMux CD) -->
  <line x1="290" y1="215" x2="430" y2="215" stroke="#fca5a5" stroke-width="3"/>
  <line x1="430" y1="215" x2="430" y2="255" stroke="#fca5a5" stroke-width="3"/>
  <line x1="430" y1="255" x2="460" y2="255" stroke="#fca5a5" stroke-width="3"/>

  <!-- Stage 2 DMux AB -->
  <rect x="460" y="80" width="130" height="90" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
  <text x="525" y="115" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DMux (ab)</text>
  <text x="525" y="135" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">sel = sel[0]</text>

  <!-- Stage 2 DMux CD -->
  <rect x="460" y="210" width="130" height="90" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
  <text x="525" y="245" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DMux (cd)</text>
  <text x="525" y="265" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">sel = sel[0]</text>

  <!-- sel[0] common line -->
  <line x1="525" y1="340" x2="525" y2="300" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="525" y1="210" x2="525" y2="170" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="525" cy="340" r="5" fill="#38bdf8"/>
  <text x="525" y="365" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">sel[0]</text>

  <!-- 4 Outputs -->
  <!-- a -->
  <line x1="590" y1="100" x2="680" y2="100" stroke="#10b981" stroke-width="3"/>
  <circle cx="680" cy="100" r="5" fill="#10b981"/>
  <text x="695" y="105" fill="#10b981" font-family="'Fira Code', monospace" font-size="15" font-weight="bold">a (sel=00)</text>

  <!-- b -->
  <line x1="590" y1="150" x2="680" y2="150" stroke="#10b981" stroke-width="3"/>
  <circle cx="680" cy="150" r="5" fill="#10b981"/>
  <text x="695" y="155" fill="#10b981" font-family="'Fira Code', monospace" font-size="15" font-weight="bold">b (sel=01)</text>

  <!-- c -->
  <line x1="590" y1="230" x2="680" y2="230" stroke="#10b981" stroke-width="3"/>
  <circle cx="680" cy="230" r="5" fill="#10b981"/>
  <text x="695" y="235" fill="#10b981" font-family="'Fira Code', monospace" font-size="15" font-weight="bold">c (sel=10)</text>

  <!-- d -->
  <line x1="590" y1="280" x2="680" y2="280" stroke="#10b981" stroke-width="3"/>
  <circle cx="680" cy="280" r="5" fill="#10b981"/>
  <text x="695" y="285" fill="#10b981" font-family="'Fira Code', monospace" font-size="15" font-weight="bold">d (sel=11)</text>
</svg>