<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="400" y="34" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Full Adder: 2 Half Adders + 1 OR Gate</text>
  <text x="400" y="58" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Sum = a ⊕ b ⊕ c, Carry = (a · b) + (c · (a ⊕ b))</text>

  <!-- Inputs a, b -->
  <line x1="60" y1="110" x2="130" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="60" cy="110" r="5" fill="#f59e0b"/>
  <text x="50" y="115" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" text-anchor="end">a</text>

  <line x1="60" y1="170" x2="130" y2="170" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="60" cy="170" r="5" fill="#f59e0b"/>
  <text x="50" y="175" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" text-anchor="end">b</text>

  <!-- HA 1 -->
  <rect x="130" y="85" width="160" height="120" rx="12" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="120" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">HalfAdder 1</text>
  <text x="210" y="142" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">(HA-1)</text>
  <text x="270" y="125" fill="#e5e7eb" font-family="'Fira Code', monospace" font-size="12">sum1</text>
  <text x="270" y="180" fill="#e5e7eb" font-family="'Fira Code', monospace" font-size="12">c1</text>

  <!-- Line sum1 to HA-2 -->
  <line x1="290" y1="120" x2="390" y2="120" stroke="#10b981" stroke-width="3"/>
  <text x="340" y="110" fill="#10b981" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">a ⊕ b</text>

  <!-- Input c -->
  <line x1="60" y1="260" x2="350" y2="260" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="60" cy="260" r="5" fill="#06b6d4"/>
  <text x="50" y="265" fill="#06b6d4" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" text-anchor="end">c (cin)</text>
  <line x1="350" y1="260" x2="350" y2="175" stroke="#06b6d4" stroke-width="3"/>
  <line x1="350" y1="175" x2="390" y2="175" stroke="#06b6d4" stroke-width="3"/>

  <!-- HA 2 -->
  <rect x="390" y="95" width="160" height="120" rx="12" fill="rgba(99, 102, 241, 0.12)" stroke="#6366f1" stroke-width="2"/>
  <text x="470" y="130" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">HalfAdder 2</text>
  <text x="470" y="152" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">(HA-2)</text>
  <text x="530" y="135" fill="#e5e7eb" font-family="'Fira Code', monospace" font-size="12">sum</text>
  <text x="530" y="190" fill="#e5e7eb" font-family="'Fira Code', monospace" font-size="12">c2</text>

  <!-- Final Sum Output -->
  <line x1="550" y1="130" x2="720" y2="130" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
  <circle cx="720" cy="130" r="6" fill="#10b981"/>
  <text x="735" y="135" fill="#10b981" font-family="'Fira Code', monospace" font-size="18" font-weight="bold">sum</text>

  <!-- Route c1 to OR -->
  <line x1="290" y1="175" x2="320" y2="175" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="320" y1="175" x2="320" y2="310" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="320" y1="310" x2="590" y2="310" stroke="#f43f5e" stroke-width="2.5"/>

  <!-- Route c2 to OR -->
  <line x1="550" y1="185" x2="570" y2="185" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="570" y1="185" x2="570" y2="340" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="570" y1="340" x2="590" y2="340" stroke="#fb923c" stroke-width="2.5"/>

  <!-- OR Gate -->
  <rect x="590" y="290" width="100" height="75" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="335" fill="#fde68a" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">OR</text>

  <!-- Final Carry Output -->
  <line x1="690" y1="325" x2="720" y2="325" stroke="#f59e0b" stroke-width="4" filter="url(#glow)"/>
  <circle cx="720" cy="325" r="6" fill="#f59e0b"/>
  <text x="735" y="331" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="18" font-weight="bold">carry</text>
</svg>