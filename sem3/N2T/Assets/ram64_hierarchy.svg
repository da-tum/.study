<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="850" height="480" fill="url(#bgGrad4)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="425" y="34" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">RAM64 Architecture: Address 100101₂ Decoding Breakdown</text>
  <text x="425" y="58" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Upper 3 bits select RAM8 #4; Lower 3 bits select Register #5 inside target RAM8</text>

  <!-- 6-bit Address Box -->
  <g transform="translate(60, 80)">
    <rect width="280" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="24" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">6-Bit Address = 100101₂</text>
    <rect x="20" y="32" width="115" height="25" rx="4" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444"/>
    <text x="77" y="49" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">100 (MSB)</text>
    <rect x="145" y="32" width="115" height="25" rx="4" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981"/>
    <text x="202" y="49" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">101 (LSB)</text>
  </g>

  <!-- DMux8Way -->
  <rect x="60" y="180" width="120" height="240" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="215" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DMux8Way</text>
  <text x="120" y="235" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">routes 'load'</text>
  <text x="120" y="255" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">sel = 100₂ (4)</text>

  <!-- RAM8 Chips Column -->
  <g transform="translate(310, 80)">
    <!-- 8 chips stacked -->
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="22" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [0] (address 000xxx)</text>

    <rect x="0" y="42" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="64" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [1] (address 001xxx)</text>

    <rect x="0" y="84" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="106" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [2] (address 010xxx)</text>

    <rect x="0" y="126" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="148" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [3] (address 011xxx)</text>

    <!-- Target RAM8 [4] HIGHLIGHTED -->
    <rect x="0" y="168" width="220" height="50" rx="8" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="2.5"/>
    <text x="110" y="193" fill="#ffffff" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">TARGET: RAM8 [4]</text>
    <text x="110" y="210" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Accesses Register 101₂ = #5</text>

    <rect x="0" y="226" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="248" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [5] (address 101xxx)</text>

    <rect x="0" y="268" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="290" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [6] (address 110xxx)</text>

    <rect x="0" y="310" width="220" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="332" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">RAM8 [7] (address 111xxx)</text>
  </g>

  <!-- Active line from DMux to RAM8 [4] -->
  <line x1="180" y1="272" x2="310" y2="272" stroke="#ef4444" stroke-width="3.5"/>
  <circle cx="180" cy="272" r="4" fill="#ef4444"/>
  <text x="245" y="265" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">load4 = load</text>

  <!-- Mux8Way16 Output Selector -->
  <rect x="630" y="180" width="130" height="240" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2"/>
  <text x="695" y="215" fill="#a7f3d0" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Mux8Way16</text>
  <text x="695" y="235" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">selects output</text>
  <text x="695" y="255" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">sel = 100₂ (4)</text>

  <!-- Line from RAM8 [4] to Mux8Way16 -->
  <line x1="530" y1="272" x2="630" y2="272" stroke="#10b981" stroke-width="3.5"/>
  <line x1="760" y1="272" x2="810" y2="272" stroke="#10b981" stroke-width="4"/>
  <circle cx="810" cy="272" r="5" fill="#10b981"/>
  <text x="810" y="300" fill="#10b981" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">out[16]</text>
</svg>