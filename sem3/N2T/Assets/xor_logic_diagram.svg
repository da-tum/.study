<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad8)" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="400" y="34" fill="#f3f4f6" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" text-anchor="middle">XOR Gate: Boolean Synthesis &amp; Logic Circuits</text>
  <text x="400" y="58" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Expression: A ⊕ B = (A · B̄) + (Ā · B) = (A + B) · (A · B)̄</text>

  <!-- Canonical AND-OR Implementation -->
  <g transform="translate(50, 90)">
    <rect width="330" height="260" rx="12" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="165" y="30" fill="#fca5a5" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">A) Standard AND-OR Formulation</text>
    
    <text x="30" y="70" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">A ──┬──</text>
    <text x="30" y="110" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">B ──┼──</text>

    <!-- Top AND (A and !B) -->
    <rect x="130" y="60" width="70" height="45" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="165" y="87" fill="#fff" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">AND 1</text>
    <text x="165" y="120" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">(A · B̄)</text>

    <!-- Bottom AND (!A and B) -->
    <rect x="130" y="145" width="70" height="45" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="165" y="172" fill="#fff" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">AND 2</text>
    <text x="165" y="205" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">(Ā · B)</text>

    <!-- Final OR -->
    <rect x="235" y="105" width="60" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="265" y="135" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" text-anchor="middle">OR</text>

    <line x1="200" y1="82" x2="235" y2="120" stroke="#fca5a5" stroke-width="2"/>
    <line x1="200" y1="167" x2="235" y2="140" stroke="#fca5a5" stroke-width="2"/>
    <line x1="295" y1="130" x2="320" y2="130" stroke="#10b981" stroke-width="3"/>
  </g>

  <!-- Minimal 4-NAND Implementation -->
  <g transform="translate(420, 90)">
    <rect width="330" height="260" rx="12" fill="rgba(99, 102, 241, 0.08)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="165" y="30" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B) Minimal 4-NAND Gate Realization</text>

    <text x="20" y="80" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">A ──</text>
    <text x="20" y="140" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="13">B ──</text>

    <!-- Center NAND 1 -->
    <rect x="70" y="90" width="55" height="40" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="129" cy="110" r="3" fill="#090d16" stroke="#6366f1" stroke-width="1.5"/>
    <text x="97" y="114" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND1</text>

    <!-- Top NAND 2 -->
    <rect x="160" y="55" width="55" height="40" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="219" cy="75" r="3" fill="#090d16" stroke="#6366f1" stroke-width="1.5"/>
    <text x="187" y="79" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND2</text>

    <!-- Bottom NAND 3 -->
    <rect x="160" y="130" width="55" height="40" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="219" cy="150" r="3" fill="#090d16" stroke="#6366f1" stroke-width="1.5"/>
    <text x="187" y="154" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND3</text>

    <!-- Output NAND 4 -->
    <rect x="250" y="92" width="55" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="309" cy="112" r="3" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <text x="277" y="116" fill="#fff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">NAND4</text>

    <line x1="312" y1="112" x2="325" y2="112" stroke="#10b981" stroke-width="3"/>
    <text x="165" y="215" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Exactly 4 NANDs (Minimal gate cost)</text>
    <text x="165" y="235" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">A ⊕ B: 00→0, 01→1, 10→1, 11→0</text>
  </g>
</svg>