<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#090d16; border-radius:16px;">
  <defs>
    <linearGradient id="atomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Banner -->
  <text x="400" y="38" text-anchor="middle" fill="#fef08a" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" letter-spacing="1">ACHARYA KANADA: VAISESHIKA ATOMIC DOCTRINE (~600 BCE)</text>
  <text x="400" y="60" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Genesis of Matter: Parmanu (Indivisible Atom) → Dvayanuka (Diatomic) → Tryanuka (Visible Triad)</text>

  <!-- Box 1: Parmanu (Single Atom) -->
  <rect x="40" y="85" width="210" height="230" rx="14" fill="url(#cardBg)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
  <text x="145" y="115" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">1. PARAMANU (परमाणु)</text>
  <circle cx="145" cy="180" r="32" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  <circle cx="145" cy="180" r="10" fill="#ffffff"/>
  <text x="145" y="240" text-anchor="middle" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Indivisible &amp; Eternal</text>
  <text x="145" y="260" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Zero dimension (Niravayava)</text>
  <text x="145" y="280" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Imperceptible to senses</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 255 200 L 295 200" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
  <polygon points="295,195 305,200 295,205" fill="#f59e0b"/>
  <text x="280" y="190" text-anchor="middle" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10">2x</text>

  <!-- Box 2: Dvayanuka (Diatomic) -->
  <rect x="310" y="85" width="210" height="230" rx="14" fill="url(#cardBg)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
  <text x="415" y="115" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">2. DVAYANUKA (द्व्यणुक)</text>
  <!-- Two bonded spheres -->
  <circle cx="395" cy="180" r="24" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="395" cy="180" r="7" fill="#ffffff"/>
  <circle cx="435" cy="180" r="24" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="435" cy="180" r="7" fill="#ffffff"/>
  <line x1="395" y1="180" x2="435" y2="180" stroke="#f59e0b" stroke-width="3"/>
  <text x="415" y="240" text-anchor="middle" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Binary Molecule (Diatomic)</text>
  <text x="415" y="260" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Formed by Adrishta / Motion</text>
  <text x="415" y="280" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Still sub-microscopic</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 525 200 L 565 200" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
  <polygon points="565,195 575,200 565,205" fill="#f59e0b"/>
  <text x="550" y="190" text-anchor="middle" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10">3x</text>

  <!-- Box 3: Tryanuka / Trasarenu (Triad) -->
  <rect x="580" y="85" width="180" height="230" rx="14" fill="url(#cardBg)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
  <text x="670" y="115" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">3. TRYANUKA (त्र्यणुक)</text>
  <!-- Triad cluster -->
  <circle cx="650" cy="165" r="18" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="690" cy="165" r="18" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="670" cy="198" r="18" fill="url(#atomGlow)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="240" text-anchor="middle" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Trasarenu (Visible Triad)</text>
  <text x="670" y="260" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Gross visible matter</text>
  <text x="670" y="280" text-anchor="middle" fill="#fde047" font-family="'Inter', sans-serif" font-size="11">e.g. Dust in sunbeam</text>

  <!-- Bottom Panel: 5 Mahabhuta Atomic Classification -->
  <rect x="40" y="335" width="720" height="105" rx="12" fill="#0d1322" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="60" y="360" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">PANCHA MAHABHUTA ATOMIC TAXONOMY:</text>

  <!-- 4 Atomic types -->
  <rect x="60" y="375" width="125" height="50" rx="8" fill="rgba(234, 179, 8, 0.08)" stroke="rgba(234, 179, 8, 0.3)"/>
  <text x="122" y="395" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Prithvi (Earth)</text>
  <text x="122" y="413" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Gandha (Smell) • Atomic</text>

  <rect x="195" y="375" width="125" height="50" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)"/>
  <text x="257" y="395" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Apas (Water)</text>
  <text x="257" y="413" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Rasa (Taste) • Atomic</text>

  <rect x="330" y="375" width="125" height="50" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)"/>
  <text x="392" y="395" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Tejas (Fire)</text>
  <text x="392" y="413" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Rupa (Form/Sight) • Atomic</text>

  <rect x="465" y="375" width="125" height="50" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="527" y="395" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Vayu (Air)</text>
  <text x="527" y="413" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Sparsha (Touch) • Atomic</text>

  <rect x="600" y="375" width="145" height="50" rx="8" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="672" y="395" text-anchor="middle" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Akasha (Space)</text>
  <text x="672" y="413" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Shabda (Sound) • Non-Atomic</text>
</svg>
