<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#090d16; border-radius:16px;">
  <defs>
    <linearGradient id="pyrGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fde047" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" letter-spacing="1">BAUDHAYANA SULBA SUTRA GEOMETRY (~800 BCE)</text>
  <text x="400" y="60" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Earliest Formulation of the Diagonal Theorem &amp; Sacred Fire Altar (Yagyavedi) Engineering</text>

  <!-- Left: Baudhayana Theorem on Rectangular Diagonal -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="345" height="345" rx="14" fill="#111827" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <text x="172" y="30" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">THE SULBA THEOREM (PRE-PYTHAGORAS)</text>
    
    <!-- Sanskrit Sutra Quote -->
    <rect x="15" y="48" width="315" height="48" rx="8" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.2)"/>
    <text x="172" y="68" text-anchor="middle" fill="#fde047" font-family="'Inter', sans-serif" font-size="11" font-style="italic">"Dīrghasyākṣaṇayā rajjuḥ pārśvamānī tiraścarmānī ca..."</text>
    <text x="172" y="85" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">The diagonal cord produces an area equal to the sum of both sides</text>

    <!-- Geometric diagram -->
    <g transform="translate(45, 115)">
      <!-- Base rectangle -->
      <rect x="0" y="60" width="140" height="90" fill="url(#pyrGlow)" stroke="#f59e0b" stroke-width="2"/>
      <!-- Diagonal line -->
      <line x1="0" y1="150" x2="140" y2="60" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3"/>
      
      <!-- Labels -->
      <text x="70" y="170" text-anchor="middle" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">Base (b)</text>
      <text x="-15" y="110" text-anchor="middle" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">Height (a)</text>
      <text x="80" y="98" fill="#f87171" font-family="'Fira Code', monospace" font-size="12" font-weight="700">Diagonal (d)</text>

      <!-- Square on diagonal outline hint -->
      <polygon points="0,150 140,60 230,200 90,290" fill="none" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- Formula -->
    <rect x="20" y="275" width="305" height="55" rx="8" fill="#0d1322" stroke="rgba(255,255,255,0.06)"/>
    <text x="172" y="297" text-anchor="middle" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="700">d² = a² + b²</text>
    <text x="172" y="318" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Preceded Pythagoras (~570–495 BCE) by ~300 years</text>
  </g>

  <!-- Right: Rational Approximation of √2 & Altar Conversion -->
  <g transform="translate(415, 85)">
    <rect x="0" y="0" width="345" height="345" rx="14" fill="#111827" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <text x="172" y="30" text-anchor="middle" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">PRECISION APPROXIMATION OF √2</text>

    <!-- Baudhayana Approximation Formula -->
    <rect x="15" y="48" width="315" height="85" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.25)"/>
    <text x="172" y="70" text-anchor="middle" fill="#93c5fd" font-family="'Fira Code', monospace" font-size="12">√2 ≈ 1 + 1/3 + 1/(3×4) - 1/(3×4×34)</text>
    <text x="172" y="93" text-anchor="middle" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700">= 577 / 408 ≈ 1.4142156...</text>
    <text x="172" y="118" text-anchor="middle" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="11">True √2 = 1.4142135... (Accurate to 5 decimals!)</text>

    <!-- Altar Engineering Context -->
    <text x="20" y="160" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Sacred Altar (Yagyavedi) Transformations:</text>
    <text x="20" y="185" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="11">• Squaring the Circle (Transforming round altar to square)</text>
    <text x="20" y="205" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="11">• Doubling the Area of a Square (Karanī theorem)</text>
    <text x="20" y="225" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="11">• Syenachiti (Falcon-shaped altar with 1,000 bricks in 5 layers)</text>
    
    <!-- Mini Altar Graphic -->
    <g transform="translate(110, 245)">
      <!-- Falcon Wings & Body -->
      <polygon points="60,0 20,40 100,40" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="45" y="40" width="30" height="35" fill="rgba(245, 158, 11, 0.3)" stroke="#f59e0b" stroke-width="1.5"/>
      <polygon points="45,75 25,90 95,90 75,75" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5"/>
      <polygon points="0,40 20,40 45,65 20,65" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1.5"/>
      <polygon points="120,40 100,40 75,65 100,65" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1.5"/>
    </g>

    <text x="172" y="338" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Syenachiti: 7½ square purushas area maintained precisely across layers</text>
  </g>
</svg>
