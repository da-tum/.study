<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#090d16; border-radius:16px;">
  <defs>
    <linearGradient id="meruGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#6ee7b7" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" letter-spacing="1">ACHARYA PINGALA: CHHANDAS SHASTRA (~300 BCE)</text>
  <text x="400" y="60" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Binary Combinatorics (Laghu &amp; Guru) &amp; Meru Prastara (Binomial Coefficients / Pascal's Triangle)</text>

  <!-- Left Column: Binary Metrics & Pingala Algorithm -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="330" height="345" rx="14" fill="#111827" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="165" y="30" text-anchor="middle" fill="#34d399" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">BINARY METRICS (LAGHU &amp; GURU)</text>
    
    <!-- Laghu / Guru cards -->
    <rect x="20" y="48" width="135" height="60" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.4)"/>
    <text x="87" y="72" text-anchor="middle" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Laghu (लघु)</text>
    <text x="87" y="92" text-anchor="middle" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="12">Short = 0 (।) </text>

    <rect x="175" y="48" width="135" height="60" rx="8" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.4)"/>
    <text x="242" y="72" text-anchor="middle" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Guru (गुरु)</text>
    <text x="242" y="92" text-anchor="middle" fill="#fef08a" font-family="'Fira Code', monospace" font-size="12">Long = 1 (ऽ) </text>

    <!-- Prastara 3-syllable permutations table -->
    <text x="20" y="135" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">3-Syllable Meter Prastara (2³ = 8):</text>
    
    <g font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">
      <text x="30" y="160">1. L L L  [0 0 0] = 0</text>
      <text x="30" y="180">2. G L L  [1 0 0] = 1</text>
      <text x="30" y="200">3. L G L  [0 1 0] = 2</text>
      <text x="30" y="220">4. G G L  [1 1 0] = 3</text>
      <text x="180" y="160">5. L L G  [0 0 1] = 4</text>
      <text x="180" y="180">6. G L G  [1 0 1] = 5</text>
      <text x="180" y="200">7. L G G  [0 1 1] = 6</text>
      <text x="180" y="220">8. G G G  [1 1 1] = 7</text>
    </g>

    <line x1="20" y1="240" x2="310" y2="240" stroke="rgba(255,255,255,0.1)"/>
    <text x="165" y="265" text-anchor="middle" fill="#fde047" font-family="'Outfit', sans-serif" font-size="12" font-weight="600">FAST EXPONENTIATION ALGORITHM</text>
    <text x="20" y="288" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Rūpe śūnyam (if even, half &amp; square)</text>
    <text x="20" y="306" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Dvir ardhe (if odd, minus 1 &amp; multiply)</text>
    <text x="20" y="326" fill="#34d399" font-family="'Fira Code', monospace" font-size="11">Precursor to O(log n) Power Algorithm</text>
  </g>

  <!-- Right Column: Meru Prastara (Pyramid of Mt Meru / Binomial Expansion) -->
  <g transform="translate(395, 85)">
    <rect x="0" y="0" width="365" height="345" rx="14" fill="#111827" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
    <text x="182" y="30" text-anchor="middle" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">MERU PRASTARA (मेरु प्रस्तार)</text>
    <text x="182" y="48" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">Halayudha's Commentary (~10th C CE)</text>

    <!-- Pyramid Rows -->
    <g font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">
      <!-- Row 0: n=0 -->
      <circle cx="182" cy="75" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="182" y="80" fill="#93c5fd">1</text>

      <!-- Row 1: n=1 -->
      <circle cx="152" cy="115" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="152" y="120" fill="#93c5fd">1</text>
      <circle cx="212" cy="115" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="212" y="120" fill="#93c5fd">1</text>

      <!-- Row 2: n=2 -->
      <circle cx="122" cy="155" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="122" y="160" fill="#93c5fd">1</text>
      <circle cx="182" cy="155" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="182" y="160" fill="#fde047">2</text>
      <circle cx="242" cy="155" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="242" y="160" fill="#93c5fd">1</text>

      <!-- Row 3: n=3 -->
      <circle cx="92" cy="195" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="92" y="200" fill="#93c5fd">1</text>
      <circle cx="152" cy="195" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="152" y="200" fill="#fde047">3</text>
      <circle cx="212" cy="195" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="212" y="200" fill="#fde047">3</text>
      <circle cx="272" cy="195" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="272" y="200" fill="#93c5fd">1</text>

      <!-- Row 4: n=4 -->
      <circle cx="62" cy="235" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="62" y="240" fill="#93c5fd">1</text>
      <circle cx="122" cy="235" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="122" y="240" fill="#fde047">4</text>
      <circle cx="182" cy="235" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="182" y="240" fill="#fde047">6</text>
      <circle cx="242" cy="235" r="14" fill="#1e3a8a" stroke="#60a5fa"/>
      <text x="242" y="240" fill="#fde047">4</text>
      <circle cx="302" cy="235" r="14" fill="#1e293b" stroke="#3b82f6"/>
      <text x="302" y="240" fill="#93c5fd">1</text>
    </g>

    <line x1="20" y1="265" x2="345" y2="265" stroke="rgba(255,255,255,0.1)"/>
    <text x="182" y="285" text-anchor="middle" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Preceded Blaise Pascal by ~1,800 Years</text>
    <text x="20" y="306" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">• Calculates Combinations: nCr = (n-1)Cr-1 + (n-1)Cr</text>
    <text x="20" y="324" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="11">• Sum of diagonals produces Fibonacci (Maatra-vritta) series</text>
  </g>
</svg>
