<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#090d16; border-radius:16px;">
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#facc15" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" letter-spacing="1">THE PANCHANGA: 5 LIMBS OF SIDDHANTIC CALENDRICS</text>
  <text x="400" y="60" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12">Mathematical Coordinates of Ancient Indian Astronomical Time Reckoning</text>

  <!-- 5 Cards Layout -->
  <g transform="translate(30, 85)">
    <!-- 1. Tithi -->
    <rect x="0" y="0" width="135" height="340" rx="12" fill="#111827" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1.5"/>
    <circle cx="67" cy="45" r="24" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308"/>
    <text x="67" y="52" text-anchor="middle" fill="#fde047" font-family="'Outfit', sans-serif" font-size="18">🌓</text>
    <text x="67" y="95" text-anchor="middle" fill="#fde047" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">1. TITHI</text>
    <text x="67" y="115" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Lunar Day</text>
    
    <rect x="10" y="130" width="115" height="195" rx="6" fill="#0d1322"/>
    <text x="18" y="152" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Definition:</text>
    <text x="18" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Angular distance</text>
    <text x="18" y="185" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">between Sun &amp; Moon</text>
    <text x="18" y="200" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">increases by 12°</text>
    
    <text x="18" y="225" fill="#fde047" font-family="'Fira Code', monospace" font-size="9.5">Δθ = θₘ - θₛ = 12°</text>
    <text x="18" y="250" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">30 Tithis / Month</text>
    <text x="18" y="268" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 15 Shukla Paksha</text>
    <text x="18" y="285" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 15 Krishna Paksha</text>
    <text x="18" y="305" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9">Purnima &amp; Amavasya</text>

    <!-- 2. Vara -->
    <rect x="150" y="0" width="135" height="340" rx="12" fill="#111827" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1.5"/>
    <circle cx="217" cy="45" r="24" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316"/>
    <text x="217" y="52" text-anchor="middle" fill="#fb923c" font-family="'Outfit', sans-serif" font-size="18">☀️</text>
    <text x="217" y="95" text-anchor="middle" fill="#fb923c" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">2. VARA</text>
    <text x="217" y="115" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Solar Weekday</text>

    <rect x="160" y="130" width="115" height="195" rx="6" fill="#0d1322"/>
    <text x="168" y="152" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Definition:</text>
    <text x="168" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Time from sunrise</text>
    <text x="168" y="185" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">to next sunrise</text>
    <text x="168" y="200" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">(Surya Udaya)</text>

    <text x="168" y="225" fill="#fb923c" font-family="'Fira Code', monospace" font-size="9.5">7 Varas (Days):</text>
    <text x="168" y="245" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">• Ravivara (Sun)</text>
    <text x="168" y="260" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">• Somavara (Moon)</text>
    <text x="168" y="275" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">• Mangalavara (Mars)</text>
    <text x="168" y="290" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">• Budhavara (Mercury)</text>
    <text x="168" y="305" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="8.5">Guru, Shukra, Shani</text>

    <!-- 3. Nakshatra -->
    <rect x="300" y="0" width="135" height="340" rx="12" fill="#111827" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
    <circle cx="367" cy="45" r="24" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6"/>
    <text x="367" y="52" text-anchor="middle" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="18">✨</text>
    <text x="367" y="95" text-anchor="middle" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">3. NAKSHATRA</text>
    <text x="367" y="115" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Lunar Mansion</text>

    <rect x="310" y="130" width="115" height="195" rx="6" fill="#0d1322"/>
    <text x="318" y="152" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Definition:</text>
    <text x="318" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Ecliptic divided into</text>
    <text x="318" y="185" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">27 equal sectors</text>
    <text x="318" y="200" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">of 13° 20' each</text>

    <text x="318" y="225" fill="#60a5fa" font-family="'Fira Code', monospace" font-size="9.5">360° / 27 = 13°20'</text>
    <text x="318" y="248" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">Position of Moon</text>
    <text x="318" y="265" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 4 Padas per Nakshatra</text>
    <text x="318" y="282" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 108 Padas total</text>
    <text x="318" y="302" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9">From Ashvini to Revati</text>

    <!-- 4. Yoga -->
    <rect x="450" y="0" width="135" height="340" rx="12" fill="#111827" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <circle cx="517" cy="45" r="24" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
    <text x="517" y="52" text-anchor="middle" fill="#34d399" font-family="'Outfit', sans-serif" font-size="18">🌀</text>
    <text x="517" y="95" text-anchor="middle" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">4. YOGA</text>
    <text x="517" y="115" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Angular Sum</text>

    <rect x="460" y="130" width="115" height="195" rx="6" fill="#0d1322"/>
    <text x="468" y="152" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Definition:</text>
    <text x="468" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Combined celestial</text>
    <text x="468" y="185" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">longitudes of Sun &amp;</text>
    <text x="468" y="200" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Moon in 13°20' parts</text>

    <text x="468" y="225" fill="#34d399" font-family="'Fira Code', monospace" font-size="9.5">θₘ + θₛ = 13°20' × k</text>
    <text x="468" y="248" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">27 Distinct Yogas</text>
    <text x="468" y="265" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 1st: Vishkambha</text>
    <text x="468" y="282" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 27th: Vaidhriti</text>
    <text x="468" y="302" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9">Evaluates auspiciousness</text>

    <!-- 5. Karana -->
    <rect x="600" y="0" width="135" height="340" rx="12" fill="#111827" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <circle cx="667" cy="45" r="24" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7"/>
    <text x="667" y="52" text-anchor="middle" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="18">⏳</text>
    <text x="667" y="95" text-anchor="middle" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">5. KARANA</text>
    <text x="667" y="115" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="10">Half Lunar Day</text>

    <rect x="610" y="130" width="115" height="195" rx="6" fill="#0d1322"/>
    <text x="618" y="152" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Definition:</text>
    <text x="618" y="170" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Half of a Tithi</text>
    <text x="618" y="185" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">(6° elongation between</text>
    <text x="618" y="200" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9.5">Sun and Moon)</text>

    <text x="618" y="225" fill="#c084fc" font-family="'Fira Code', monospace" font-size="9.5">Δθ = 6° (Half-Tithi)</text>
    <text x="618" y="248" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">60 Karanas / Month</text>
    <text x="618" y="265" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 7 Movable (Chara)</text>
    <text x="618" y="282" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="9">• 4 Fixed (Sthira)</text>
    <text x="618" y="302" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="9">Governs action timing</text>
  </g>
</svg>
